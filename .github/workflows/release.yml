name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify release
    if: github.repository == 'lowlydba/python-carson-living'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run tests
        run: python -m pytest --cov=carson_living --cov-report=term-missing

      - name: Run flake8
        run: flake8 carson_living tests scripts

      - name: Run pylint
        run: pylint carson_living tests scripts

  release:
    name: Release
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: write # Create the release commit, tag, and GitHub Release.
      id-token: write # Authenticate to PyPI through Trusted Publishing.

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create GitHub release
        id: release
        uses: python-semantic-release/python-semantic-release@9a026e9303981c866c3425723009becb2437c757 # v10.6.2
        with:
          build: false
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        if: steps.release.outputs.released == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Build distribution
        if: steps.release.outputs.released == 'true'
        run: python -m pip install --upgrade build && python -m build

      - name: Publish distribution to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
