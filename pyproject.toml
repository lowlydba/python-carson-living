[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carson-living-electric-boogaloo"
version = "0.0.0"
description = "A Python library to communicate with Carson Living Residences"
readme = "README.rst"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
  { name = "Martin Riedel", email = "web@riedel-it.de" },
]
keywords = [
  "carson living",
  "virtual doorman",
  "home automation",
]
classifiers = [
  "Environment :: Other Environment",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Home Automation",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "requests>=2.25.1,<3",
  "PyJWT>=2.4.0,<3",
]

[project.optional-dependencies]
test = [
  "flake8>=7,<8",
  "pylint>=3,<4",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "requests-mock>=1.12,<2",
]

[project.urls]
Homepage = "https://github.com/lowlydba/python-carson-living"
Repository = "https://github.com/lowlydba/python-carson-living"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["carson_living*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = [".git"]

[tool.semantic_release]
allow_zero_version = true
commit_message = "chore(release): {version} [skip ci]"
commit_parser = "conventional"
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
